hero:
  title: Burgerinitiatief Leyduin
  subtitle: Kies voor een veilige verbinding voor wandelaars tussen Heemstede en Buitenplaats Leyduin!
  intro_1: |-
    Het eerste Burgerinitiatief Leyduin voor de realisatie van een <strong>voetgangerstunnel (met fietsgoot)</strong> onder het spoor wordt in <strong>2026</strong> door de gemeenteraad besproken.

    Een tunnel geeft wandelaars een <strong>veilige en directe route</strong> en toegang tot het prachtige natuurgebied Leyduin voor een gezond “ommetje”.
  intro_2: |-
    Wilt u ook een veilige en directe wandelroute via een voetgangerstunnel naar Leyduin?
    Op <strong>18 maart</strong> a.s. zijn de gemeenteraadsverkiezingen — <strong>maak met uw stem het verschil!</strong>
  intro_3a: Alle politieke partijen in Heemstede die nu deel uitmaken van de raad hebben het Burgerinitiatief gesteund, maar met name <strong>CDA</strong> en <strong>GroenLinks-PvdA</strong> hebben zich de afgelopen jaren sterk gemaakt voor de realisatie van de tunnel en benadrukken tevens het belang ervan in hun verkiezingsprogramma.
  intro_3b: Bij de andere partijen die nu deel uitmaken van de raad staat er niets over de voetgangerstunnel in het verkiezingsprogramma.
  intro_3c: De partij <strong>SSH</strong>, die nu geen deel uitmaakt van de raad, is ook voorstander van een tunnel en heeft dat opgenomen in het verkiezingsprogramma.
  btn_primary: Waarom een tunneltje?
  btn_secondary: Contact
toegang:
  title: Doel van het Burgerinitiatief
  img_caption: Bewoners verzetten zich tegen de komende afsluiting, een zonder alternatief. Foto United Photos/Toussaint Kluiters
  para_1: |-
    Met het Burgerinitiatief Leyduin verzoeken de indieners de gemeenteraad van Heemstede na te gaan of de realisatie van een eenvoudige voetgangerstunnel (met fietsgoot) onder het spoor bij Leyduin mogelijk is ter vervanging van de inmiddels afgesloten Niet Actief Beveiligde Overweg (NABO).

    Het doel is een veilige, goed bereikbare toegang via een onderdoorgang te realiseren die de verbinding met Leyduin vanaf de Leidsevaart herstelt voor het gezonde en veilige "ommetje" van de vele wandelaars.
  para_2: |-
    In het kader van een landelijk veiligheidsprogramma sloot ProRail de onbewaakte spoorwegovergang (NABO) bij Leyduin definitief op 29 maart 2024. 

    Sindsdien ontbreekt een veilige en directe toegang voor wandelaars tot Leyduin en het achterliggende duingebied. Met een tunneltje kan deze toegang weer hersteld worden.

    Het Burgerinitiatief om dit tunneltje op de agenda van de Gemeenteraad te plaatsen, werd ondertekend door 1678 inwoners en is op 17 april 2025 officieel ingediend bij de burgemeester. Verdere bespreking en behandeling vindt plaats na de verkiezingen in 2026.
gevolgen:
  title: Gevolgen van de sluiting
  img_caption_manpad: De smalle en drukke Manpadslaan — de huidige omleiding voor wandelaars.
  img_caption_verboden: Bord bij de gesloten spoorwegovergang (NABO) bij Leyduin.
  intro: 'Sinds de afsluiting zijn bezoekers van Buitenplaats Leyduin aangewezen op de bewaakte spoorwegovergang bij de Manpadslaan. Dit leidt tot meerdere problemen:'
  items:
    - 'De omweg is aanzienlijk: vanaf de Amstelbrug in de Rivierenbuurt is de route heen en terug circa 2,5 kilometer langer. Voor wandelaars die een "ommetje" willen maken is dit een grote barrière.'
    - Wandelaars moeten gebruikmaken van een druk en smal fietspad langs de Leidsevaartweg, ongeschikt voor gecombineerd gebruik door fietsers, wandelaars, kinderwagens, honden en rolstoelen. Zeker met fietsverkeer in twee richtingen en het toegenomen gebruik van elektrische (bak)fietsen en fatbikes.
    - De route via Manpadslaan is ook een smalle weg zonder veilige loopruimte. Via deze route is het doel voor het maken van een "ommetje" ook geen optie.
    - In de toekomst zullen er vaker treinen rijden tussen Haarlem en Leiden, waardoor de slagbomen bij de Manpadslaan nog vaker sluiten en de doorstroming verslechtert.
    - Vanaf de Leidsevaartweg is er vanaf Station Heemstede Aerdenhout tot Bennebroek over 4,5 kilometer slechts 1(!) toegang tot Buitenplaats Leyduin. Oók een risico bij incidenten aan de overgang Manpadslaan.
  emphasis: 'Kortom: de huidige situatie is onveilig, onpraktisch en ontmoedigt recreatief gebruik van het gebied door wandelaars.'
doel:
  title: Waarom een tunneltje?
  cards:
    - icon: 🛡️
      title: Veiligheid
      text: Een tunneltje scheidt langzaam verkeer volledig van het spoor en geeft daarmee maximale veiligheid voor voetgangers en fietsers. Ook zorgt een tunnel voor veiliger verkeer op het fietspad langs de Leidsevaartweg en op de Manpadslaan.
    - icon: 🚶
      title: Bereikbaarheid
      text: De huidige omleiding via de Manspadlaan kost wandelaars aanzienlijk meer tijd. Een tunnel herstelt de korte, directe route naar het natuurgebied.
    - icon: 🌳
      title: Recreatie & natuur
      text: Buitenplaats Leyduin en het achterliggende duingebied zijn van grote recreatieve waarde. Een goede verbinding spreidt de recreatiedruk en maakt de natuur toegankelijk voor meer mensen.
    - icon: ❤️
      title: Gezondheid
      text: Wandelen en fietsen in de natuur dragen bij aan lichamelijke en mentale gezondheid. Een directe en veilige route verlaagt de drempel om naar buiten te gaan.
eerdere_plannen:
  title: Terugblik
  img_caption_1: Aanbieding van het burgerinitiatief met 1.678 handtekeningen aan de burgemeester.
  img_caption_2: Massale steun voor aanleg voetgangerstunnel Leyduin — Haarlems Dagblad.
  img_caption_weiland: Het weiland naast het pompstation aan de Leidsevaartweg — de beoogde locatie van de tunnel.
  img_caption_bord: Bewoners verzetten zich tegen de komende afsluiting, een zonder alternatief. Foto United Photos/Toussaint Kluiters
  img_caption_alverna: "Dát er geen alternatief werd geboden, was extra schrijnend vanwege wat zich 10 jaar eerder afspeelde bij de sluiting van de spoorwegovergang bij het Laantje van Alverna in 2014. Toen kregen inwoners te horen dat de overweg bij Leyduin als alternatief zou blijven bestaan!"
  para_1: Een aantal jaar vóór de sluiting is al gezocht naar een veilig alternatief. In maart 2022 werd een intentieovereenkomst tussen de gemeente Heemstede en ProRail getekend om een voetgangerstunnel met fietsgoot te bouwen, gesitueerd op het weiland links van het voormalige pompstation langs de Leidsevaartweg.
  para_2: De bouw van een tunnel is echter nooit gestart. Sommige politieke partijen wilden alleen instemmen met een volwaardige fietstunnel met hellingen voor fietsers en rolstoelrijders. Dit plan bleek financieel onaantrekkelijk en verdween vervolgens van de agenda zonder bespreking van de alternatieve uitvoeringen zoals de voetgangerstunnel met fietsgoot.
  para_3: |-
    Toen de overgang definitief werd gesloten en de tunneloptie was geschrapt, is een actiegroep opgericht om hier opnieuw aandacht voor te vragen. 
    De voetgangerstunnel met fietsgoot is volgens ons - en de vele mensen die ons steun hebben gegeven bij het Burgerinitiatief - de beste oplossing  voor een veilige doorgang naar Leyduin.
  para_4: Vanuit de Gemeente zijn geen alternatieven of voorzieningen geboden voor een veilige wandelroute naar en toegang tot Leyduin. De wandelaars die een "ommetje" willen maken, blijven weg.  Andere bezoekers van de Buitenplaats Leyduin zijn aangewezen op fiets of auto dan wel het lopen van de extra kilometers naar de spoorwegovergang bij Manpadslaan.
  para_5: Dit moet anders kunnen! Het Burgerinitiatief bood de mogelijkheid om de tunneloptie opnieuw op de agenda van de Gemeenteraad te krijgen. Toen we merkten dat er veel steun was hiervoor, haalden we binnen korte tijd 1.678 handtekeningen en daarnaast nog vele steunbetuigingen van Heemsteedse inwoners op. Dit was ruim voldoende om het eerste Burgerinitiatief in deze gemeente in te dienen. Het initiatief is in april 2025 aangeboden en staat nu op de agenda van de Gemeenteraad die de haalbaarheid en financiering van de tunneloptie zal onderzoeken.
